# REGISTERS this controller: core-provider pulls the chart and serves it as a composition. Installing
# one creates its RestDefinitions, and oasgen-provider then generates Form in eventfeedback.example.io
# (v1alpha1), each with a <Kind>Configuration that names the credential Secret.
# Once release 0.1.0 is green, register it from the portal: Controller Builder -> your controllers
# -> Register; Install then creates a composition of it, which applies the RestDefinitions (portal#275).
# The same file is attached to https://github.com/krateo-blueprints/event-feedback/releases/tag/0.1.0.
apiVersion: core.krateo.io/v1alpha1
kind: CompositionDefinition
metadata:
  name: event-feedback
  namespace: krateo-system
spec:
  chart:
    url: oci://ghcr.io/krateo-blueprints/charts/event-feedback
    version: 0.1.0
